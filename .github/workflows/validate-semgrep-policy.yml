name: validate-semgrep-policy

on:
  pull_request:
    paths:
      - ".github/actions/semgrep-policy/**"
      - ".github/workflows/validate-semgrep-policy.yml"
      - "fixtures/semgrep/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: semgrep rule unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate ruleid, ok and todoruleid expectations
        shell: bash
        run: semgrep scan --test .github/actions/semgrep-policy
      - name: Verify documented interfile limitation
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan \
            --config .github/actions/semgrep-policy/rules.yml \
            --metrics off \
            --json \
            --output /tmp/sg05-interfile.json \
            fixtures/semgrep/sg05
          findings="$(jq '.results | length' /tmp/sg05-interfile.json)"
          if [[ "$findings" != "0" ]]; then
            echo "::error title=SG-05 expectation changed::Semgrep detected the interfile fixture. Replace todoruleid with ruleid and reassess the documented CE limit."
            exit 1
          fi
          {
            echo "### SG-05 — known Community Edition limitation"
            echo
            echo "- Source and sink are split across two Java files."
            echo "- Findings: **0**"
            echo "- Decision: **KNOWN_FN_INTERFILE**; this is evidence of a limit, not approved coverage."
          } >> "$GITHUB_STEP_SUMMARY"
