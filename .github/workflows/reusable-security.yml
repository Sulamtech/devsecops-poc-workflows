name: reusable-security

on:
  workflow_call:
    inputs:
      image-name:
        description: Local image name used for the container scan
        required: true
        type: string
      export-image-artifact:
        description: Export the exact nonblocking image for a downstream publish-contract job
        required: false
        default: false
        type: boolean
      poc-scanner-outage:
        description: PoC-only fault injection that proves scanner failure prevents promotion
        required: false
        default: false
        type: boolean
    outputs:
      scanned-image-id:
        description: Immutable Docker image ID evaluated by Trivy
        value: ${{ jobs.container.outputs.scanned-image-id }}
      image-artifact-name:
        description: Artifact containing the exact scanned image and subject manifest
        value: ${{ jobs.container.outputs.image-artifact-name }}
      image-archive-sha256:
        description: SHA-256 of the exported Docker archive
        value: ${{ jobs.container.outputs.image-archive-sha256 }}
      image-subject-commit:
        description: Trusted commit represented by the exported image
        value: ${{ jobs.container.outputs.image-subject-commit }}

permissions: {}

jobs:
  secrets:
    name: secrets / gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve trusted commit range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          baseline="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            baseline="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            baseline="$(git rev-parse HEAD^)"
          fi
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SCANNER_ERROR: trusted base/head SHA is unavailable. Retry from a complete pull_request or push event."
            exit 30
          fi
          if ! git cat-file -e "$baseline^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "::error::SCANNER_ERROR: trusted base/head commit is missing from the checkout."
            exit 30
          fi
          echo "BASELINE_COMMIT=$baseline" >> "$GITHUB_ENV"
          echo "HEAD_COMMIT=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Install pinned Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version
      - name: Materialize trusted time-bound Gitleaks exceptions
        shell: bash
        run: |
          set -euo pipefail
          source_path=".devsecops/gitleaks-exceptions.tsv"
          trusted_source="$RUNNER_TEMP/gitleaks-exceptions.tsv"
          trusted_ignore="$RUNNER_TEMP/trusted.gitleaksignore"
          active_exceptions="$RUNNER_TEMP/gitleaks-active-exceptions.tsv"
          policy_errors="$RUNNER_TEMP/gitleaks-policy-errors.txt"
          : > "$trusted_source"
          : > "$trusted_ignore"
          : > "$active_exceptions"
          : > "$policy_errors"

          if git cat-file -e "${BASELINE_COMMIT}:${source_path}" 2>/dev/null; then
            git show "${BASELINE_COMMIT}:${source_path}" > "$trusted_source"
          fi

          today="$(date -u +%F)"
          line_number=0
          while IFS=$'\t' read -r fingerprint expires owner reason extra || [[ -n "${fingerprint:-}" ]]; do
            line_number=$((line_number + 1))
            [[ -z "${fingerprint// }" || "$fingerprint" == \#* ]] && continue
            if [[ -n "${extra:-}" || -z "$fingerprint" || ! "$expires" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || -z "$owner" || -z "$reason" ]]; then
              echo "Line ${line_number}: expected fingerprint<TAB>expires<TAB>owner<TAB>reason." >> "$policy_errors"
              continue
            fi
            if ! date -u -d "$expires" +%F >/dev/null 2>&1; then
              echo "Line ${line_number}: expiry ${expires} is not a real UTC date." >> "$policy_errors"
              continue
            fi
            if [[ "$expires" < "$today" ]]; then
              echo "Line ${line_number}: exception owned by ${owner} expired on ${expires}." >> "$policy_errors"
              continue
            fi
            printf '%s\n' "$fingerprint" >> "$trusted_ignore"
            printf '%s\t%s\t%s\t%s\n' "$fingerprint" "$expires" "$owner" "$reason" >> "$active_exceptions"
          done < "$trusted_source"

          echo "GITLEAKS_TRUSTED_EXCEPTION_COUNT=$(wc -l < "$trusted_ignore" | tr -d ' ')" >> "$GITHUB_ENV"
      - name: Scan trusted PR history
        id: gitleaks-scan
        shell: bash
        run: |
          set -euo pipefail
          trusted_ignore="$RUNNER_TEMP/trusted.gitleaksignore"
          consumer_ignore_present=false
          if [[ -e .gitleaksignore || -L .gitleaksignore ]]; then
            consumer_ignore_present=true
            rm -rf -- .gitleaksignore
          fi
          echo "CONSUMER_GITLEAKSIGNORE_PRESENT=$consumer_ignore_present" >> "$GITHUB_ENV"
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --redact=100 \
            --no-color \
            --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$trusted_ignore" \
            --max-decode-depth 1 \
            --max-archive-depth 1 \
            --max-target-megabytes 0 \
            --report-format json \
            --report-path gitleaks-results.json \
            --exit-code 10 \
            --log-opts="--no-merges $BASELINE_COMMIT..$HEAD_COMMIT" \
            --verbose \
            .
          status=$?
          set -e
          echo "GITLEAKS_EXIT_CODE=$status" >> "$GITHUB_ENV"
          if [[ ! -f gitleaks-results.json ]]; then
            printf '%s\n' "Gitleaks exited with code $status without producing JSON evidence." > gitleaks-scanner-error.txt
          fi
      - name: Audit trusted-base exception use
        id: gitleaks-exception-audit
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --redact=100 \
            --no-color \
            --ignore-gitleaks-allow \
            --max-decode-depth 1 \
            --max-archive-depth 1 \
            --max-target-megabytes 0 \
            --report-format json \
            --report-path gitleaks-audit-results.json \
            --exit-code 10 \
            --log-opts="--no-merges $BASELINE_COMMIT..$HEAD_COMMIT" \
            .
          status=$?
          set -e
          echo "GITLEAKS_AUDIT_EXIT_CODE=$status" >> "$GITHUB_ENV"
          if [[ ! -f gitleaks-audit-results.json ]]; then
            printf '%s\n' "Gitleaks exception audit exited with code $status without producing JSON evidence." >> gitleaks-scanner-error.txt
          fi
      - name: Classify Gitleaks result
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          command_escape() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//':'/'%3A'}"
            value="${value//','/'%2C'}"
            printf '%s' "$value"
          }

          markdown_escape() {
            local value="$1"
            value="${value//$'\r'/ }"
            value="${value//$'\n'/ }"
            value="${value//'|'/'\|'}"
            printf '%s' "$value"
          }

          if [[ -s "$RUNNER_TEMP/gitleaks-policy-errors.txt" ]]; then
            {
              echo "### Gitleaks — \`POLICY_ERROR\`"
              echo
              echo "The trusted-base exception registry is invalid or contains expired approvals:"
              echo
              while IFS= read -r error; do
                echo "- $(markdown_escape "$error")"
              done < "$RUNNER_TEMP/gitleaks-policy-errors.txt"
              echo
              echo "**How to fix:** renew or remove the exception in the protected base branch. This PR cannot approve its own suppression."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gitleaks POLICY_ERROR::Trusted exception evidence is invalid or expired. Update it through the protected approval flow."
            exit 31
          fi

          if [[ ! -f gitleaks-results.json ]] ||
             ! jq --exit-status 'type == "array"' gitleaks-results.json >/dev/null ||
             [[ ! -f gitleaks-audit-results.json ]] ||
             ! jq --exit-status 'type == "array"' gitleaks-audit-results.json >/dev/null; then
            {
              echo "### Gitleaks — \`SCANNER_ERROR\`"
              echo
              echo "Gitleaks did not produce valid finding and exception-audit JSON evidence. Retry the workflow; if it repeats, escalate to the workflow owner."
              echo
              echo "- Version: \`$GITLEAKS_VERSION\`"
              echo "- Comparison: \`$BASELINE_COMMIT..$HEAD_COMMIT\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gitleaks scanner error::SCANNER_ERROR: valid JSON evidence was not produced."
            exit 30
          fi

          findings="$(jq 'length' gitleaks-results.json)"
          audit_findings="$(jq 'length' gitleaks-audit-results.json)"
          if { [[ "$GITLEAKS_AUDIT_EXIT_CODE" == "0" ]] && [[ "$audit_findings" != "0" ]]; } ||
             { [[ "$GITLEAKS_AUDIT_EXIT_CODE" == "10" ]] && [[ "$audit_findings" == "0" ]]; } ||
             [[ "$GITLEAKS_AUDIT_EXIT_CODE" != "0" && "$GITLEAKS_AUDIT_EXIT_CODE" != "10" ]]; then
            {
              echo "### Gitleaks — \`SCANNER_ERROR\`"
              echo
              echo "The trusted-base exception audit returned inconsistent exit code or JSON evidence."
              echo
              echo "**Action:** retry once; if it repeats, escalate to the workflow owner."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gitleaks scanner error::SCANNER_ERROR: trusted-base exception audit was inconsistent."
            exit 30
          fi

          used_exceptions="$RUNNER_TEMP/gitleaks-used-exceptions.tsv"
          : > "$used_exceptions"
          while IFS= read -r finding; do
            finding_fingerprint="$(jq -r '.Fingerprint // empty' <<< "$finding")"
            [[ -z "$finding_fingerprint" ]] && continue
            while IFS=$'\t' read -r fingerprint expires owner reason; do
              if [[ "$finding_fingerprint" == "$fingerprint" ]]; then
                printf '%s\t%s\t%s\t%s\n' "$fingerprint" "$expires" "$owner" "$reason" >> "$used_exceptions"
                break
              fi
            done < "$RUNNER_TEMP/gitleaks-active-exceptions.tsv"
          done < <(jq -c '.[]' gitleaks-audit-results.json)
          sort -u -o "$used_exceptions" "$used_exceptions"
          used_exception_count="$(wc -l < "$used_exceptions" | tr -d ' ')"

          if [[ "$GITLEAKS_EXIT_CODE" == "0" && "$findings" == "0" ]]; then
            if [[ "$used_exception_count" != "0" ]]; then
              {
                echo "### Gitleaks — \`WARN\`"
                echo
                echo "No actionable secret remains after applying trusted-base exceptions, but approved findings were observed and remain auditable."
                echo
                echo "| Fingerprint | Owner | Expires | Reason |"
                echo "|---|---|---|---|"
                while IFS=$'\t' read -r fingerprint expires owner reason; do
                  printf '| `%s` | %s | `%s` | %s |\n' \
                    "$(markdown_escape "$fingerprint")" \
                    "$(markdown_escape "$owner")" \
                    "$(markdown_escape "$expires")" \
                    "$(markdown_escape "$reason")"
                done < "$used_exceptions"
                echo
                echo "- Used trusted-base exceptions: **$used_exception_count**"
                echo "- Suppressions supplied by the PR: **not trusted**"
                echo "- Values: **100% redacted**"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Gitleaks trusted-base exception::WARN: $used_exception_count approved finding(s) matched active trusted-base exceptions. Review owner and expiry in the job summary."
              exit 0
            fi
            {
              echo "### Gitleaks — \`PASS\`"
              echo
              echo "- Version: \`$GITLEAKS_VERSION\`"
              echo "- Commits scanned: \`$BASELINE_COMMIT..$HEAD_COMMIT\`"
              echo "- Actionable secrets introduced: **0**"
              echo "- Suppressions supplied by the PR: **not trusted**"
              echo "- Active trusted-base exceptions: **$GITLEAKS_TRUSTED_EXCEPTION_COUNT**"
              echo "- Consumer \`.gitleaksignore\` observed: **$CONSUMER_GITLEAKSIGNORE_PRESENT**"
              echo "- Encoded/archive/large-file coverage: **enabled / depth 1 / no size skip**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$GITLEAKS_EXIT_CODE" != "10" || "$findings" == "0" ]]; then
            {
              echo "### Gitleaks — \`SCANNER_ERROR\`"
              echo
              echo "Gitleaks returned exit code \`$GITLEAKS_EXIT_CODE\` with \`$findings\` parsed findings. This is a scanner failure, not a security finding."
              echo
              echo "**Action:** retry once; if it repeats, escalate to the workflow owner."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Gitleaks scanner error::SCANNER_ERROR: inconsistent exit code and evidence."
            exit 30
          fi

          {
            echo "### Gitleaks — \`BLOCK\`"
            echo
            echo "A secret-like value was introduced in this PR. Values are fully redacted."
            echo
            echo "| Rule | File | Line | Commit | Fingerprint |"
            echo "|---|---|---:|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r finding; do
            rule="$(jq -r '.RuleID // "unknown-rule"' <<< "$finding")"
            file="$(jq -r '.File // "unknown-file"' <<< "$finding")"
            line="$(jq -r '.StartLine // 1' <<< "$finding")"
            commit="$(jq -r '.Commit // "unknown-commit"' <<< "$finding")"
            fingerprint="$(jq -r '.Fingerprint // "unavailable"' <<< "$finding")"
            printf '| %s | %s | %s | `%s` | `%s` |\n' \
              "$(markdown_escape "$rule")" \
              "$(markdown_escape "$file")" \
              "$line" \
              "$(markdown_escape "$commit")" \
              "$(markdown_escape "$fingerprint")" >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=$(command_escape "$file"),line=$line,title=Gitleaks $(command_escape "$rule")::BLOCK: secret-like value detected. Remove it from every PR commit, revoke or rotate it if ever active, and load it from GitHub Secrets or the approved secret manager."
          done < <(jq -c '.[]' gitleaks-results.json)

          {
            echo
            echo "**Impact:** a committed credential can be recovered from Git history even when deleted later."
            echo
            echo "**Remediation:** remove the value from every commit in this PR, revoke or rotate it if it was ever active, and inject the replacement through GitHub Secrets or the approved secret manager. Push the rewritten branch and rerun the checks."
            echo
            echo "A same-PR \`.gitleaksignore\` entry or \`gitleaks:allow\` comment cannot approve this finding."
            echo "Consumer \`.gitleaksignore\` observed: **$CONSUMER_GITLEAKSIGNORE_PRESENT**."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 10
  semgrep:
    name: sast / semgrep-delta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep@sha256:2b33f46ba66cf8cc2ad59ccfa7d22951fd00c632c38f1339e84ec8e6e641a942
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize trusted Semgrep policy
        uses: Sulamtech/devsecops-poc-workflows/.github/actions/semgrep-policy@a543caef95af9997b07c8e40e68291fa83081e8d
        with:
          output-path: /tmp/semgrep-poc-policy.yml
      - name: Materialize trusted Semgrep exclusions
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\t%s\t%s\t%s\n' \
            'generated/sg12/**' \
            'security-platform' \
            '2026-08-31' \
            'KAN-118 generated-code canary; review the excluded finding before renewal.' \
            > /tmp/semgrep-poc-exclusions.tsv
      - name: Resolve trusted comparison commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          baseline="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            baseline="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            baseline="$(git rev-parse HEAD^)"
          fi
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SCANNER_ERROR: trusted base/head SHA is unavailable."
            exit 30
          fi
          if ! git cat-file -e "$baseline^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "::error::SCANNER_ERROR: trusted base/head commit is missing from the checkout."
            exit 30
          fi
          echo "BASELINE_COMMIT=$baseline" >> "$GITHUB_ENV"
          echo "HEAD_COMMIT=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Scan full and delta Semgrep findings
        shell: bash
        run: |
          set -euo pipefail
          consumer_ignore_present=false
          if [[ -e .semgrepignore || -L .semgrepignore ]]; then
            consumer_ignore_present=true
            rm -rf -- .semgrepignore
          fi
          echo "CONSUMER_SEMGREPIGNORE_PRESENT=$consumer_ignore_present" >> "$GITHUB_ENV"

          excluded_changes="$RUNNER_TEMP/semgrep-excluded-changes.tsv"
          : > "$excluded_changes"
          today="$(date -u +%F)"
          exclude_args=()
          while IFS=$'\t' read -r pattern owner expires reason extra; do
            if [[ -n "${extra:-}" || -z "$pattern" || -z "$owner" || -z "$reason" \
              || ! "$expires" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || "$expires" < "$today" ]]; then
              echo "::error title=Semgrep POLICY_ERROR::Trusted exclusion metadata is invalid or expired."
              exit 31
            fi
            exclude_args+=(--exclude "$pattern")
            while IFS= read -r -d '' path; do
              if [[ ! "$path" =~ ^[A-Za-z0-9._/-]+$ ]]; then
                echo "::error title=Semgrep POLICY_ERROR::Excluded path cannot be represented safely."
                exit 31
              fi
              if [[ "$path" == $pattern ]]; then
                printf '%s\t%s\t%s\t%s\n' "$path" "$owner" "$expires" "$reason" >> "$excluded_changes"
              fi
            done < <(git diff --name-only -z --diff-filter=ACMRT "$BASELINE_COMMIT" "$HEAD_COMMIT")
          done < /tmp/semgrep-poc-exclusions.tsv

          set +e
          semgrep scan \
            --config /tmp/semgrep-poc-policy.yml \
            --disable-nosem \
            --metrics off \
            "${exclude_args[@]}" \
            --json \
            --output semgrep-full.json \
            .
          full_status=$?
          semgrep scan \
            --config /tmp/semgrep-poc-policy.yml \
            --disable-nosem \
            --metrics off \
            --baseline-commit "$BASELINE_COMMIT" \
            "${exclude_args[@]}" \
            --json \
            --output semgrep-delta.json \
            .
          delta_status=$?

          excluded_status=0
          printf '{"results":[]}\n' > semgrep-excluded-audit.json
          if [[ -s "$excluded_changes" ]]; then
            mapfile -t excluded_paths < <(cut -f1 "$excluded_changes")
            semgrep scan \
              --config /tmp/semgrep-poc-policy.yml \
              --disable-nosem \
              --metrics off \
              --json \
              --output semgrep-excluded-audit.json \
              "${excluded_paths[@]}"
            excluded_status=$?
          fi
          set -e
          echo "SEMGREP_FULL_EXIT_CODE=$full_status" >> "$GITHUB_ENV"
          echo "SEMGREP_DELTA_EXIT_CODE=$delta_status" >> "$GITHUB_ENV"
          echo "SEMGREP_EXCLUDED_EXIT_CODE=$excluded_status" >> "$GITHUB_ENV"
          version="$(semgrep --version)"
          version="${version%%$'\n'*}"
          echo "SEMGREP_VERSION=${version//$'\r'/}" >> "$GITHUB_ENV"
      - name: Classify Semgrep result
        shell: bash
        run: |
          set -euo pipefail

          command_escape() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//':'/'%3A'}"
            value="${value//','/'%2C'}"
            printf '%s' "$value"
          }

          markdown_escape() {
            local value="$1"
            value="${value//$'\r'/ }"
            value="${value//$'\n'/ }"
            value="${value//'|'/'\|'}"
            printf '%s' "$value"
          }

          if [[ "$SEMGREP_FULL_EXIT_CODE" != "0" || "$SEMGREP_DELTA_EXIT_CODE" != "0" || "$SEMGREP_EXCLUDED_EXIT_CODE" != "0" ]]; then
            decision=SCANNER_ERROR
            exit_code=30
            if [[ "$SEMGREP_FULL_EXIT_CODE" == "7" || "$SEMGREP_DELTA_EXIT_CODE" == "7" || "$SEMGREP_EXCLUDED_EXIT_CODE" == "7" ]]; then
              decision=POLICY_ERROR
              exit_code=31
            fi
            {
              echo "### Semgrep delta — \`$decision\`"
              echo
              echo "Semgrep could not produce a trustworthy decision."
              echo
              echo "- Full scan exit: \`$SEMGREP_FULL_EXIT_CODE\`"
              echo "- Delta scan exit: \`$SEMGREP_DELTA_EXIT_CODE\`"
              echo "- Excluded-path audit exit: \`$SEMGREP_EXCLUDED_EXIT_CODE\`"
              echo "- Action: inspect the policy/scanner log, correct it, and rerun. This result is not a vulnerability finding."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Semgrep $decision::$decision: Semgrep could not produce a trustworthy decision."
            exit "$exit_code"
          fi

          if ! jq --exit-status '.results | type == "array"' semgrep-full.json >/dev/null \
            || ! jq --exit-status '.results | type == "array"' semgrep-delta.json >/dev/null \
            || ! jq --exit-status '.results | type == "array"' semgrep-excluded-audit.json >/dev/null; then
            echo "### Semgrep delta — \`SCANNER_ERROR\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Semgrep scanner error::SCANNER_ERROR: invalid JSON evidence."
            exit 30
          fi

          full_findings="$(jq '.results | length' semgrep-full.json)"
          findings="$(jq '.results | length' semgrep-delta.json)"
          excluded_findings="$(jq '.results | length' semgrep-excluded-audit.json)"
          inherited=$((full_findings - findings))
          if (( findings == 0 && excluded_findings > 0 )); then
            {
              echo "### Semgrep delta — \`WARN\`"
              echo
              echo "Trusted central exclusions hid **$excluded_findings** finding(s) from the blocking scan. They remain visible and require review before the exception expires."
              echo
              echo "| Path | Owner | Expires | Reason |"
              echo "|---|---|---|---|"
              while IFS=$'\t' read -r path owner expires reason; do
                printf '| `%s` | %s | `%s` | %s |\n' \
                  "$(markdown_escape "$path")" \
                  "$(markdown_escape "$owner")" \
                  "$(markdown_escape "$expires")" \
                  "$(markdown_escape "$reason")"
              done < "$RUNNER_TEMP/semgrep-excluded-changes.tsv"
              echo
              echo "**Decision:** WARN — approved generated-path exclusion is visible; this is not proof that the code is safe."
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r finding; do
              file="$(jq -r '.path // "unknown-file"' <<< "$finding")"
              line="$(jq -r '.start.line // 1' <<< "$finding")"
              rule="$(jq -r '.check_id // "unknown-rule" | sub("^tmp\\."; "")' <<< "$finding")"
              echo "::warning file=$(command_escape "$file"),line=$line,title=Semgrep excluded $(command_escape "$rule")::WARN: finding is under an approved central exclusion and remains visible for review."
            done < <(jq -c '.results[]' semgrep-excluded-audit.json)
            exit 0
          fi
          if (( findings == 0 )); then
            {
              echo "### Semgrep delta — \`PASS\`"
              echo
              echo "- Version: \`$SEMGREP_VERSION\`"
              echo "- Comparison: \`$BASELINE_COMMIT..$HEAD_COMMIT\`"
              echo "- New blocking findings: **0**"
              echo "- Existing findings visible but nonblocking: **$inherited**"
              echo "- Consumer \`.semgrepignore\` observed: **$CONSUMER_SEMGREPIGNORE_PRESENT**"
              echo "- Inline \`nosemgrep\` suppressions: **disabled for this gate**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Semgrep delta — \`BLOCK\`"
            echo
            echo "| Rule | CWE | File | Line | Source | Sink |"
            echo "|---|---|---|---:|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r finding; do
            rule="$(jq -r '.check_id // "unknown-rule" | sub("^tmp\\."; "")' <<< "$finding")"
            cwe="$(jq -r '.extra.metadata.cwe // "unclassified"' <<< "$finding")"
            file="$(jq -r '.path // "unknown-file"' <<< "$finding")"
            line="$(jq -r '.start.line // 1' <<< "$finding")"
            source="$(jq -r '.extra.metadata.source // "review data origin"' <<< "$finding")"
            sink="$(jq -r '.extra.metadata.sink // "review dangerous operation"' <<< "$finding")"
            remediation="$(jq -r '.extra.metadata.remediation // "Remove the unsafe data flow and rerun the PR."' <<< "$finding")"
            printf '| %s | %s | %s | %s | %s | %s |\n' \
              "$(markdown_escape "$rule")" \
              "$(markdown_escape "$cwe")" \
              "$(markdown_escape "$file")" \
              "$line" \
              "$(markdown_escape "$source")" \
              "$(markdown_escape "$sink")" >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=$(command_escape "$file"),line=$line,title=Semgrep $(command_escape "$rule")::BLOCK ($cwe): $source reaches $sink. $remediation"
          done < <(jq -c '.results[]' semgrep-delta.json)

          {
            echo
            echo "**Decision:** BLOCK — correct each new source-to-sink flow and rerun. Same-PR ignores and inline suppressions are not trusted."
            echo
            echo "Detailed stack-specific remediation is included in each annotation and in the trusted policy metadata."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 10
  dependencies:
    name: sca / trivy-filesystem-delta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve trusted comparison commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          baseline="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            baseline="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            baseline="$(git rev-parse HEAD^)"
          fi
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SCANNER_ERROR: trusted base/head SHA is unavailable. Retry from a complete pull_request or push event."
            exit 30
          fi
          if ! git cat-file -e "$baseline^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "::error::SCANNER_ERROR: trusted base/head commit is missing from the checkout."
            exit 30
          fi
          baseline_root="$RUNNER_TEMP/trivy-fs-base"
          git worktree add --detach "$baseline_root" "$baseline"
          echo "BASELINE_COMMIT=$baseline" >> "$GITHUB_ENV"
          echo "HEAD_COMMIT=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "BASELINE_ROOT=$baseline_root" >> "$GITHUB_ENV"
      - name: Evaluate dependency evidence integrity
        shell: bash
        run: |
          set -euo pipefail
          state=PASS
          reason="Dependency manifests have deterministic evidence."
          missing_manifests=()
          deleted_locks=()

          while IFS= read -r lockfile; do
            [[ -z "$lockfile" ]] && continue
            directory="$(dirname "$lockfile")"
            [[ "$directory" == "." ]] && manifest="package.json" || manifest="$directory/package.json"
            if git cat-file -e "$HEAD_COMMIT:$manifest" 2>/dev/null; then
              deleted_locks+=("$lockfile")
            fi
          done < <(git diff --diff-filter=D --name-only "$BASELINE_COMMIT" "$HEAD_COMMIT" -- '*package-lock.json' '*npm-shrinkwrap.json' '*pnpm-lock.yaml' '*yarn.lock')

          while IFS= read -r manifest; do
            [[ -z "$manifest" || "$manifest" == *node_modules/* ]] && continue
            directory="$(dirname "$manifest")"
            [[ "$directory" == "." ]] && prefix="" || prefix="$directory/"
            has_lock=false
            for lock in package-lock.json npm-shrinkwrap.json pnpm-lock.yaml yarn.lock; do
              if git cat-file -e "$HEAD_COMMIT:${prefix}${lock}" 2>/dev/null; then
                has_lock=true
                break
              fi
            done
            if [[ "$has_lock" == "false" ]]; then
              missing_manifests+=("$manifest")
            fi
          done < <(git ls-tree -r --name-only "$HEAD_COMMIT" | awk '/(^|\/)package\.json$/')

          if (( ${#deleted_locks[@]} > 0 )); then
            state=BLOCK
            reason="A lockfile present in the trusted base was deleted while its package manifest remains."
          elif (( ${#missing_manifests[@]} > 0 )); then
            state=WARN
            reason="A JavaScript package manifest has no recognized lockfile; range resolution is not deterministic."
          fi

          jq -n \
            --arg state "$state" \
            --arg reason "$reason" \
            --argjson deleted_locks "$(printf '%s\n' "${deleted_locks[@]:-}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            --argjson missing_manifests "$(printf '%s\n' "${missing_manifests[@]:-}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            '{state: $state, reason: $reason, deleted_locks: $deleted_locks, missing_manifests: $missing_manifests}' \
            > trivy-fs-integrity.json
          echo "DEPENDENCY_EVIDENCE_STATE=$state" >> "$GITHUB_ENV"
          echo "DEPENDENCY_EVIDENCE_REASON=$reason" >> "$GITHUB_ENV"
      - name: Remove untrusted consumer suppressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' suppression_files < <(
            git ls-files -z -- \
              '.trivyignore' '**/.trivyignore' \
              'trivy.yaml' '**/trivy.yaml' \
              'trivy.yml' '**/trivy.yml'
          )
          printf '%s\0' "${suppression_files[@]:-}" |
            jq -Rs 'split("\u0000") | map(select(length > 0))' > trivy-fs-consumer-controls.json
          if (( ${#suppression_files[@]} > 0 )); then
            printf '%s\0' "${suppression_files[@]}" | xargs -0 -- rm -f --
          fi
      - name: Materialize trusted KEV snapshot
        shell: bash
        run: |
          cat > trivy-fs-kev.json <<'JSON'
          {
            "source": "https://www.cisa.gov/known-exploited-vulnerabilities-catalog",
            "snapshot_date": "2026-07-22",
            "scope": "poc-fixtures-only",
            "cves": [
              "CVE-2021-44228",
              "CVE-2021-45046",
              "CVE-2025-54236"
            ]
          }
          JSON
      - name: Materialize trusted VEX decisions
        shell: bash
        run: |
          cat > trivy-fs-vex.json <<'JSON'
          {
            "scope": "poc-fixtures-only",
            "statements": [
              {
                "vulnerability": "CVE-2023-30533",
                "product": "pkg:npm/xlsx@0.18.5",
                "status": "not_affected",
                "justification": "vulnerable_code_not_in_execute_path",
                "owner": "KAN-118 PoC",
                "expires_at": "2026-08-31T23:59:59Z"
              },
              {
                "vulnerability": "CVE-2024-22363",
                "product": "pkg:npm/xlsx@0.18.5",
                "status": "not_affected",
                "justification": "vulnerable_code_not_in_execute_path",
                "owner": "KAN-118 PoC",
                "expires_at": "2026-08-31T23:59:59Z"
              }
            ]
          }
          JSON
      - name: Scan HEAD dependencies and refresh the database
        id: trivy_fs_head
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-head.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          cache: "false"
          version: v0.69.3
      - name: Scan trusted base with the same database
        id: trivy_fs_base
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          scan-type: fs
          scan-ref: ${{ env.BASELINE_ROOT }}
          format: json
          output: trivy-fs-base.json
          severity: CRITICAL,HIGH
          exit-code: "0"
          cache: "false"
          skip-setup-trivy: "true"
          version: v0.69.3
      - name: Capture Trivy and database versions
        id: trivy_fs_version
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" version --format json > trivy-version.json
      - name: Classify Trivy filesystem result
        if: ${{ always() }}
        shell: bash
        env:
          HEAD_SCAN_OUTCOME: ${{ steps.trivy_fs_head.outcome }}
          BASE_SCAN_OUTCOME: ${{ steps.trivy_fs_base.outcome }}
          VERSION_OUTCOME: ${{ steps.trivy_fs_version.outcome }}
        run: |
          set -euo pipefail

          command_escape() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//':'/'%3A'}"
            value="${value//','/'%2C'}"
            printf '%s' "$value"
          }

          scanner_error() {
            local reason="$1"
            jq -n --arg decision SCANNER_ERROR --arg reason "$reason" \
              --arg head_outcome "$HEAD_SCAN_OUTCOME" --arg base_outcome "$BASE_SCAN_OUTCOME" \
              --arg version_outcome "$VERSION_OUTCOME" \
              '{decision: $decision, reason: $reason, head_scan: $head_outcome, base_scan: $base_outcome, version_check: $version_outcome}' \
              > trivy-fs-decision.json
            {
              echo "### Trivy filesystem delta — \`SCANNER_ERROR\`"
              echo
              echo "$reason"
              echo
              echo "- HEAD scan: \`$HEAD_SCAN_OUTCOME\`"
              echo "- Base scan: \`$BASE_SCAN_OUTCOME\`"
              echo "- Version evidence: \`$VERSION_OUTCOME\`"
              echo "- Action: retry the job. Do not interpret this result as zero vulnerabilities."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Trivy filesystem SCANNER_ERROR::SCANNER_ERROR: $reason Retry the job; this is not a clean vulnerability result."
            exit 30
          }

          if [[ "$HEAD_SCAN_OUTCOME" != "success" || "$BASE_SCAN_OUTCOME" != "success" || "$VERSION_OUTCOME" != "success" ]]; then
            scanner_error "Trivy did not complete both scans and database attestation successfully."
          fi
          for evidence in trivy-fs-head.json trivy-fs-base.json trivy-version.json trivy-fs-integrity.json trivy-fs-kev.json trivy-fs-vex.json; do
            [[ -s "$evidence" ]] || scanner_error "Required evidence $evidence is missing or empty."
            jq empty "$evidence" >/dev/null 2>&1 || scanner_error "Required evidence $evidence is invalid JSON."
          done

          trivy_version="$(jq -r '.Version // empty' trivy-version.json)"
          db_updated="$(jq -r '.VulnerabilityDB.UpdatedAt // empty' trivy-version.json)"
          [[ -n "$trivy_version" && -n "$db_updated" ]] || scanner_error "Trivy or vulnerability database version metadata is unavailable."
          db_epoch="$(date --date="$db_updated" +%s 2>/dev/null || true)"
          now_epoch="$(date +%s)"
          [[ "$db_epoch" =~ ^[0-9]+$ ]] || scanner_error "Vulnerability database timestamp cannot be parsed."
          db_age_hours=$(( (now_epoch - db_epoch) / 3600 ))
          (( db_age_hours <= 24 )) || scanner_error "Vulnerability database is older than the approved 24-hour freshness window."
          expired_vex="$(jq '[.statements[]? | select((.expires_at | fromdateiso8601) < now)] | length' trivy-fs-vex.json)"
          if (( expired_vex > 0 )); then
            jq -n --arg decision POLICY_ERROR --arg reason "Trusted VEX evidence is expired." \
              '{decision: $decision, reason: $reason}' > trivy-fs-decision.json
            echo "### Trivy filesystem delta — \`POLICY_ERROR\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Trivy filesystem POLICY_ERROR::POLICY_ERROR: trusted VEX evidence is expired and cannot suppress a finding."
            exit 20
          fi

          if ! jq --slurpfile base trivy-fs-base.json --slurpfile kev trivy-fs-kev.json --slurpfile vex trivy-fs-vex.json '
            ([ $base[0].Results[]? as $result
              | $result.Vulnerabilities[]?
              | [$result.Target, .VulnerabilityID, .PkgName, .InstalledVersion] | @json ]) as $known
            | .Results = [(.Results // [])[] |
                . as $result
                | .Vulnerabilities = [
                    (.Vulnerabilities // [])[] as $vulnerability
                    | select(([$result.Target, $vulnerability.VulnerabilityID, $vulnerability.PkgName, $vulnerability.InstalledVersion] | @json) as $key | ($known | index($key) | not))
                    | $vulnerability + {
                        ApprovedNotAffected: (
                          [($vex[0].statements // [])[]
                            | select(
                                .vulnerability == $vulnerability.VulnerabilityID
                                and .product == ($vulnerability.PkgIdentifier.PURL // "")
                                and .status == "not_affected"
                              )] | length > 0
                        ),
                        KnownExploited: (($kev[0].cves | index($vulnerability.VulnerabilityID)) != null),
                        HasFix: (
                          (($vulnerability.FixedVersion // "") | length) > 0
                          and ($vulnerability.FixedVersion != "<0.0.0")
                        ),
                        DependencyRelationship: (
                          [($result.Packages // [])[]
                            | select(.Name == $vulnerability.PkgName and .Version == $vulnerability.InstalledVersion)
                            | .Relationship][0] // "unknown"
                        )
                      }
                  ]
              ]
          ' trivy-fs-head.json > trivy-fs-delta.json; then
            scanner_error "Trivy dependency evidence could not be compared."
          fi

          total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-fs-head.json)"
          delta_total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-fs-delta.json)"
          fixable="$(jq '[.Results[]?.Vulnerabilities[]? | select(.ApprovedNotAffected != true and .HasFix == true)] | length' trivy-fs-delta.json)"
          known_exploited="$(jq '[.Results[]?.Vulnerabilities[]? | select(.ApprovedNotAffected != true and .KnownExploited == true)] | length' trivy-fs-delta.json)"
          suppressed="$(jq '[.Results[]?.Vulnerabilities[]? | select(.ApprovedNotAffected == true)] | length' trivy-fs-delta.json)"
          blocking="$(jq '[.Results[]?.Vulnerabilities[]? | select(.ApprovedNotAffected != true and (.HasFix == true or .KnownExploited == true))] | length' trivy-fs-delta.json)"
          unfixed="$(jq '[.Results[]?.Vulnerabilities[]? | select(.ApprovedNotAffected != true and .HasFix != true and .KnownExploited != true)] | length' trivy-fs-delta.json)"
          inherited=$((total - delta_total))
          targets="$(jq '[.Results[]? | select((.Vulnerabilities // []) | length > 0)] | length' trivy-fs-head.json)"
          integrity_state="$(jq -r '.state' trivy-fs-integrity.json)"
          integrity_reason="$(jq -r '.reason' trivy-fs-integrity.json)"
          consumer_controls="$(jq 'length' trivy-fs-consumer-controls.json)"

          decision=PASS
          exit_code=0
          if [[ "$integrity_state" == "BLOCK" ]] || (( blocking > 0 )); then
            decision=BLOCK
            exit_code=10
          elif [[ "$integrity_state" == "WARN" ]] || (( unfixed > 0 || inherited > 0 || suppressed > 0 )); then
            decision=WARN
          fi

          jq -n \
            --arg decision "$decision" --arg reason "$integrity_reason" --arg trivy_version "$trivy_version" \
            --arg db_updated "$db_updated" --argjson db_age_hours "$db_age_hours" \
            --argjson blocking "$blocking" --argjson fixable "$fixable" --argjson known_exploited "$known_exploited" --argjson suppressed "$suppressed" --argjson unfixed "$unfixed" \
            --argjson inherited "$inherited" --argjson targets "$targets" \
            '{decision: $decision, reason: $reason, trivy_version: $trivy_version, database_updated_at: $db_updated, database_age_hours: $db_age_hours, introduced_blocking: $blocking, introduced_fixable: $fixable, introduced_known_exploited: $known_exploited, approved_not_affected: $suppressed, introduced_unfixed_non_kev: $unfixed, inherited: $inherited, affected_targets: $targets}' \
            > trivy-fs-decision.json

          {
            echo "### Trivy filesystem delta — \`$decision\`"
            echo
            echo "- Trivy: \`$trivy_version\`"
            echo "- Vulnerability DB updated: \`$db_updated\` (**${db_age_hours}h** old)"
            echo "- Comparison: \`$BASELINE_COMMIT..$HEAD_COMMIT\`"
            echo "- Dependency evidence: **$integrity_state** — $integrity_reason"
            echo "- Consumer suppression/config files ignored by the trusted gate: **$consumer_controls**"
            echo "- Introduced blocking findings: **$blocking**"
            echo "- Introduced High/Critical with fix: **$fixable**"
            echo "- Introduced CISA KEV matches: **$known_exploited**"
            echo "- Approved \`not_affected\` VEX statements applied: **$suppressed**"
            echo "- Introduced High/Critical without fix and not KEV: **$unfixed**"
            echo "- Inherited findings visible but nonblocking: **$inherited**"
            echo "- Affected targets in HEAD: **$targets**"
            if (( suppressed > 0 )); then
              echo
              echo "| VEX vulnerability | Product | Justification | Owner | Expires |"
              echo "|---|---|---|---|---|"
              jq -r --slurpfile vex trivy-fs-vex.json '
                .Results[]?.Vulnerabilities[]?
                | select(.ApprovedNotAffected == true)
                | . as $finding
                | $vex[0].statements[]
                | select(
                    .vulnerability == $finding.VulnerabilityID
                    and .product == ($finding.PkgIdentifier.PURL // "")
                    and .status == "not_affected"
                  )
                | [.vulnerability, .product, .justification, .owner, .expires_at]
                | @tsv
              ' trivy-fs-delta.json |
                while IFS=$'\t' read -r vulnerability product justification owner expires; do
                  printf '| `%s` | `%s` | %s | %s | `%s` |\n' \
                    "${vulnerability//|/\\|}" "${product//|/\\|}" "${justification//|/\\|}" \
                    "${owner//|/\\|}" "${expires//|/\\|}"
                done
            fi
            if (( delta_total > 0 )); then
              echo
              echo "| Decision | Target | Relationship | KEV | Vulnerability | Package | Installed | Fixed | Severity | Title | Advisory |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|"
              jq -r '.Results[]? as $result | $result.Vulnerabilities[]? | [
                (if .ApprovedNotAffected == true then "SUPPRESSED" elif .HasFix == true or .KnownExploited == true then "BLOCK" else "WARN" end),
                $result.Target,
                (.DependencyRelationship // "unknown"),
                (if .KnownExploited == true then "yes" else "no" end),
                .VulnerabilityID,
                .PkgName,
                .InstalledVersion,
                (if .HasFix == true then .FixedVersion else "No fix available" end),
                .Severity,
                (.Title // "No title supplied"),
                (.PrimaryURL // "No advisory URL supplied")
              ] | @tsv' trivy-fs-delta.json |
                while IFS=$'\t' read -r finding_decision target relationship kev id package installed fixed severity title advisory; do
                  printf '| %s | %s | %s | %s | %s | %s | %s | %s | %s | %s | %s |\n' \
                    "${finding_decision//|/\\|}" "${target//|/\\|}" "${relationship//|/\\|}" "${kev//|/\\|}" "${id//|/\\|}" "${package//|/\\|}" \
                    "${installed//|/\\|}" "${fixed//|/\\|}" "${severity//|/\\|}" "${title//|/\\|}" "${advisory//|/\\|}"
                  level=warning
                  [[ "$finding_decision" == "BLOCK" ]] && level=error
                  [[ "$finding_decision" == "SUPPRESSED" ]] && level=notice
                  echo "::$level file=$(command_escape "$target"),line=1,title=Trivy $(command_escape "$id")::${finding_decision} ($severity, $relationship dependency, KEV: $kev): $package $installed; fixed in ${fixed}. ${title} Advisory: ${advisory}" >&2
                done
            fi
            if [[ "$integrity_state" == "BLOCK" ]]; then
              echo
              echo "**Remediation:** restore and regenerate the deleted lockfile from the manifest, then rerun this PR."
            elif (( blocking > 0 )); then
              echo
              echo "**Remediation:** upgrade to a listed fixed version. If a KEV has no patched version, remove or isolate the component under an approved exception before rerunning."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$integrity_state" == "BLOCK" ]]; then
            while IFS= read -r lockfile; do
              echo "::error file=$(command_escape "$lockfile"),line=1,title=Dependency lockfile deleted::BLOCK: restore and regenerate this lockfile; dependency analysis is no longer deterministic."
            done < <(jq -r '.deleted_locks[]' trivy-fs-integrity.json)
          elif [[ "$integrity_state" == "WARN" ]]; then
            while IFS= read -r manifest; do
              echo "::warning file=$(command_escape "$manifest"),line=1,title=Dependency evidence incomplete::WARN: add and commit the package-manager lockfile so exact versions can be evaluated."
            done < <(jq -r '.missing_manifests[]' trivy-fs-integrity.json)
          fi
          exit "$exit_code"
  container:
    name: container / trivy-image-delta
    # A pull request never builds a temporary image. The real candidate is built only after merge.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    outputs:
      scanned-image-id: ${{ steps.classify_image.outputs.scanned_image_id }}
      image-artifact-name: ${{ steps.export_candidate.outputs.artifact_name }}
      image-archive-sha256: ${{ steps.export_candidate.outputs.archive_sha256 }}
      image-subject-commit: ${{ steps.export_candidate.outputs.subject_commit }}
    steps:
      - name: PoC fault — simulate Trivy image scanner outage
        if: inputs.poc-scanner-outage
        shell: bash
        run: |
          echo "::error title=Trivy image SCANNER_ERROR::PoC fault injection: the image scanner is unavailable. Retry after service recovery; do not publish or deploy."
          exit 30
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve trusted comparison commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          baseline="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            baseline="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::SCANNER_ERROR: trusted base/head SHA is unavailable. Retry from a complete pull_request or push event."
            exit 30
          fi
          if ! git cat-file -e "$baseline^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "::error::SCANNER_ERROR: trusted base/head commit is missing from the checkout."
            exit 30
          fi
          baseline_root="$RUNNER_TEMP/trivy-image-base"
          git worktree add --detach "$baseline_root" "$baseline"
          echo "BASELINE_COMMIT=$baseline" >> "$GITHUB_ENV"
          echo "BASELINE_ROOT=$baseline_root" >> "$GITHUB_ENV"
      - name: Build HEAD and trusted base images
        id: build_images
        shell: bash
        env:
          HEAD_TAG: ${{ inputs.image-name }}:head-${{ github.event.pull_request.head.sha || github.sha }}
          BASE_TAG: ${{ inputs.image-name }}:base-${{ env.BASELINE_COMMIT }}
        run: |
          set -euo pipefail
          set +e
          docker build --pull --tag "$HEAD_TAG" . > trivy-image-head-build.log 2>&1
          head_status=$?
          docker build --pull --tag "$BASE_TAG" "$BASELINE_ROOT" > trivy-image-base-build.log 2>&1
          base_status=$?
          set -e

          head_image_id=""
          base_image_id=""
          if (( head_status == 0 )); then
            head_image_id="$(docker image inspect --format '{{.Id}}' "$HEAD_TAG")"
          fi
          if (( base_status == 0 )); then
            base_image_id="$(docker image inspect --format '{{.Id}}' "$BASE_TAG")"
          fi

          jq -n \
            --arg head_tag "$HEAD_TAG" \
            --arg base_tag "$BASE_TAG" \
            --arg head_image_id "$head_image_id" \
            --arg base_image_id "$base_image_id" \
            --argjson head_status "$head_status" \
            --argjson base_status "$base_status" \
            '{
              head: {tag: $head_tag, image_id: $head_image_id, build_exit_code: $head_status},
              base: {tag: $base_tag, image_id: $base_image_id, build_exit_code: $base_status}
            }' > trivy-image-build.json

          echo "head_ok=$([[ $head_status == 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "base_ok=$([[ $base_status == 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "head_tag=$HEAD_TAG" >> "$GITHUB_OUTPUT"
          echo "head_image_id=$head_image_id" >> "$GITHUB_OUTPUT"
          echo "base_image_id=$base_image_id" >> "$GITHUB_OUTPUT"
      - name: Remove consumer-controlled Trivy policy
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o \
            \( -name '.trivyignore' -o -name 'trivy.yaml' -o -name 'trivy.yml' \) \
            -print0 |
            tee trivy-image-consumer-controls.bin |
            xargs -0r rm -rf --
          jq -Rs 'split("\u0000") | map(select(length > 0))' \
            trivy-image-consumer-controls.bin > trivy-image-consumer-controls.json
          rm -f trivy-image-consumer-controls.bin
      - name: Report complete HEAD image findings
        id: trivy_image_sarif
        if: steps.build_images.outputs.head_ok == 'true' && steps.build_images.outputs.base_ok == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ steps.build_images.outputs.head_image_id }}
          format: sarif
          output: trivy-image-full.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: "true"
          ignore-unfixed: false
          exit-code: "0"
          cache: "false"
          version: v0.69.3
      - name: Scan trusted base image with the same database
        id: trivy_image_base
        if: steps.build_images.outputs.head_ok == 'true' && steps.build_images.outputs.base_ok == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          scan-type: image
          scan-ref: ${{ steps.build_images.outputs.base_image_id }}
          format: json
          output: trivy-image-base.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
          cache: "false"
          skip-setup-trivy: "true"
          version: v0.69.3
      - name: Scan HEAD image with the same database
        id: trivy_image_head
        if: steps.build_images.outputs.head_ok == 'true' && steps.build_images.outputs.base_ok == 'true'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          scan-type: image
          scan-ref: ${{ steps.build_images.outputs.head_image_id }}
          format: json
          output: trivy-image-head.json
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
          cache: "false"
          skip-setup-trivy: "true"
          version: v0.69.3
      - name: Capture Trivy and database versions
        id: trivy_image_version
        if: steps.build_images.outputs.head_ok == 'true' && steps.build_images.outputs.base_ok == 'true'
        continue-on-error: true
        shell: bash
        run: trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" version --format json > trivy-image-version.json
      - name: Calculate and enforce image delta
        id: classify_image
        if: ${{ always() }}
        shell: bash
        env:
          SARIF_SCAN_OUTCOME: ${{ steps.trivy_image_sarif.outcome }}
          BASE_SCAN_OUTCOME: ${{ steps.trivy_image_base.outcome }}
          HEAD_SCAN_OUTCOME: ${{ steps.trivy_image_head.outcome }}
          VERSION_OUTCOME: ${{ steps.trivy_image_version.outcome }}
          HEAD_TAG: ${{ steps.build_images.outputs.head_tag }}
          HEAD_IMAGE_ID: ${{ steps.build_images.outputs.head_image_id }}
          BASE_IMAGE_ID: ${{ steps.build_images.outputs.base_image_id }}
          POC_SCANNER_OUTAGE: ${{ inputs.poc-scanner-outage }}
        run: |
          set -euo pipefail
          write_decision() {
            local decision="$1"
            local reason="$2"
            jq -n \
              --arg decision "$decision" \
              --arg reason "$reason" \
              --arg baseline_commit "${BASELINE_COMMIT:-unavailable}" \
              --arg head_commit "${{ github.event.pull_request.head.sha || github.sha }}" \
              --arg scanned_image_id "$HEAD_IMAGE_ID" \
              '{decision: $decision, reason: $reason, baseline_commit: $baseline_commit, head_commit: $head_commit, scanned_image_id: $scanned_image_id}' \
              > trivy-image-decision.json
          }

          if [[ "$POC_SCANNER_OUTAGE" == "true" ]]; then
            reason="PoC fault injection confirmed that the image scanner is unavailable."
            write_decision SCANNER_ERROR "$reason"
            {
              echo "### Trivy image delta — \`SCANNER_ERROR\`"
              echo
              echo "$reason No publish or deployment is permitted."
              echo
              echo "**Remediation:** retry after scanner service recovery."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Trivy image SCANNER_ERROR::SCANNER_ERROR: $reason Retry after service recovery; do not publish or deploy."
            exit 30
          fi

          build_head_status="$(jq -r '.head.build_exit_code' trivy-image-build.json)"
          build_base_status="$(jq -r '.base.build_exit_code' trivy-image-build.json)"
          if (( build_head_status != 0 || build_base_status != 0 )); then
            reason="HEAD build exit=$build_head_status; trusted base build exit=$build_base_status."
            write_decision BUILD_ERROR "$reason"
            {
              echo "### Trivy image delta — \`BUILD_ERROR\`"
              echo
              echo "$reason No clean image result was produced."
              echo
              echo "**Remediation:** inspect the uploaded HEAD/base build logs, reproduce the failing Dockerfile command, and rerun the PR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Container BUILD_ERROR::BUILD_ERROR: $reason No image was reported as clean."
            exit 31
          fi

          scanner_error() {
            local reason="$1"
            write_decision SCANNER_ERROR "$reason"
            {
              echo "### Trivy image delta — \`SCANNER_ERROR\`"
              echo
              echo "$reason This is not a clean vulnerability result."
              echo
              echo "**Remediation:** retry the job. If the error persists, inspect Trivy/DB availability and the uploaded evidence."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Trivy image SCANNER_ERROR::SCANNER_ERROR: $reason Retry the job; this is not a clean vulnerability result."
            exit 30
          }

          [[ "$SARIF_SCAN_OUTCOME" == success ]] || scanner_error "The complete HEAD SARIF scan failed or was skipped."
          [[ "$BASE_SCAN_OUTCOME" == success ]] || scanner_error "The trusted base JSON scan failed or was skipped."
          [[ "$HEAD_SCAN_OUTCOME" == success ]] || scanner_error "The HEAD JSON scan failed or was skipped."
          [[ "$VERSION_OUTCOME" == success ]] || scanner_error "Trivy version metadata could not be captured."
          for evidence in trivy-image-full.sarif trivy-image-base.json trivy-image-head.json trivy-image-version.json; do
            [[ -s "$evidence" ]] || scanner_error "Required evidence $evidence is missing or empty."
          done

          trivy_version="$(jq -r '.Version // empty' trivy-image-version.json)"
          db_updated="$(jq -r '.VulnerabilityDB.UpdatedAt // empty' trivy-image-version.json)"
          [[ -n "$trivy_version" && -n "$db_updated" ]] || scanner_error "Trivy or vulnerability database version metadata is unavailable."
          if ! db_epoch="$(date -u -d "$db_updated" +%s 2>/dev/null)"; then
            scanner_error "Vulnerability database UpdatedAt is invalid: $db_updated."
          fi
          now_epoch="$(date -u +%s)"
          db_age_hours=$(( (now_epoch - db_epoch) / 3600 ))
          (( db_age_hours >= 0 && db_age_hours <= 24 )) || scanner_error "Vulnerability database is ${db_age_hours}h old; maximum accepted age is 24h."

          current_tag_image_id="$(docker image inspect --format '{{.Id}}' "$HEAD_TAG" 2>/dev/null || true)"
          if [[ -z "$HEAD_IMAGE_ID" || "$current_tag_image_id" != "$HEAD_IMAGE_ID" ]]; then
            reason="The mutable tag $HEAD_TAG now resolves to ${current_tag_image_id:-missing}, but Trivy evaluated $HEAD_IMAGE_ID."
            write_decision BLOCK "$reason"
            {
              echo "### Trivy image delta — \`BLOCK\`"
              echo
              echo "$reason"
              echo
              echo "**Remediation:** publish only the immutable scanned image ID. Never rebuild or retag a different image after scanning."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Container image integrity BLOCK::BLOCK: $reason"
            exit 10
          fi

          if ! jq --slurpfile base trivy-image-base.json '
            ([
              $base[0].Results[]? as $result
              | ($result.Vulnerabilities // [])[]
              | [
                  ($result.Target | sub("^sha256:[^ ]+ "; "")),
                  $result.Class,
                  $result.Type,
                  .VulnerabilityID,
                  .PkgName,
                  .InstalledVersion
                ]
              | @json
            ]) as $known
            | .Results |= map(
                . as $result
                | .Vulnerabilities = [
                  (.Vulnerabilities // [])[]
                  | .Target = $result.Target
                  | .TargetScope = ($result.Target | sub("^sha256:[^ ]+ "; ""))
                  | .TargetClass = $result.Class
                  | .TargetType = $result.Type
                  | .HasFix = (
                      ((.FixedVersion // "") | length) > 0
                      and .FixedVersion != "<0.0.0"
                    )
                  | .AdvisoryURL = (.PrimaryURL // .References[0] // "")
                  | select(([
                      ($result.Target | sub("^sha256:[^ ]+ "; "")),
                      $result.Class,
                      $result.Type,
                      .VulnerabilityID,
                      .PkgName,
                      .InstalledVersion
                    ] | @json) as $key | ($known | index($key) | not))
                ]
              )
          ' trivy-image-head.json > trivy-image-delta.json; then
            scanner_error "Trivy image evidence could not be compared."
          fi

          total="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image-head.json)"
          introduced="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-image-delta.json)"
          blocking="$(jq '[.Results[]?.Vulnerabilities[]? | select(.HasFix == true)] | length' trivy-image-delta.json)"
          unfixed="$(jq '[.Results[]?.Vulnerabilities[]? | select(.HasFix != true)] | length' trivy-image-delta.json)"
          inherited=$((total - introduced))
          targets="$(jq '[.Results[]? | select((.Vulnerabilities // []) | length > 0)] | length' trivy-image-head.json)"
          consumer_controls="$(jq 'length' trivy-image-consumer-controls.json)"
          decision=PASS
          (( inherited > 0 )) && decision=WARN
          (( unfixed > 0 )) && decision=WARN
          (( blocking > 0 )) && decision=BLOCK

          reason="$blocking fixable blocking, $unfixed unfixed warning, $inherited inherited finding(s)."
          jq -n \
            --arg decision "$decision" \
            --arg reason "$reason" \
            --arg baseline_commit "$BASELINE_COMMIT" \
            --arg head_commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --arg scanned_image_id "$HEAD_IMAGE_ID" \
            --arg current_tag_image_id "$current_tag_image_id" \
            --arg trivy_version "$trivy_version" \
            --arg database_updated_at "$db_updated" \
            --argjson database_age_hours "$db_age_hours" \
            --argjson introduced_blocking "$blocking" \
            --argjson introduced_unfixed "$unfixed" \
            --argjson inherited "$inherited" \
            --argjson targets "$targets" \
            --argjson consumer_controls_ignored "$consumer_controls" \
            '{
              decision: $decision,
              reason: $reason,
              baseline_commit: $baseline_commit,
              head_commit: $head_commit,
              scanned_image_id: $scanned_image_id,
              current_tag_image_id: $current_tag_image_id,
              trivy_version: $trivy_version,
              database_updated_at: $database_updated_at,
              database_age_hours: $database_age_hours,
              introduced_blocking: $introduced_blocking,
              introduced_unfixed: $introduced_unfixed,
              inherited: $inherited,
              affected_targets: $targets,
              consumer_controls_ignored: $consumer_controls_ignored
            }' > trivy-image-decision.json
          echo "scanned_image_id=$HEAD_IMAGE_ID" >> "$GITHUB_OUTPUT"

          {
            echo "### Trivy image delta — \`$decision\`"
            echo
            echo "- Immutable scanned image: \`$HEAD_IMAGE_ID\`"
            echo "- Trivy: \`$trivy_version\`"
            echo "- Vulnerability DB: \`$db_updated\` (**${db_age_hours}h** old)"
            echo "- Affected targets/layers: **$targets**"
            echo "- Introduced fixable findings: **$blocking**"
            echo "- Introduced findings without a fix: **$unfixed**"
            echo "- Inherited findings visible but nonblocking: **$inherited**"
            echo "- Consumer Trivy ignore/config files neutralized: **$consumer_controls**"
            echo "- Comparison: \`$BASELINE_COMMIT..${{ github.event.pull_request.head.sha || github.sha }}\` using one Trivy database snapshot"
            if (( introduced > 0 )); then
              echo
              echo "| Target/layer | Vulnerability | Package | Installed | Fixed | Severity | Description | Advisory |"
              echo "|---|---|---|---|---|---|---|---|"
              jq -r '.Results[]?.Vulnerabilities[]? | [.Target, .VulnerabilityID, .PkgName, .InstalledVersion, (if .HasFix then .FixedVersion else "No fix published" end), .Severity, (.Title // "No title supplied"), .AdvisoryURL] | @tsv' trivy-image-delta.json |
                while IFS=$'\t' read -r target id package installed fixed severity title advisory; do
                  printf '| %s | %s | %s | %s | %s | %s | %s | %s |\n' "${target//|/\\|}" "${id//|/\\|}" "${package//|/\\|}" "${installed//|/\\|}" "${fixed//|/\\|}" "${severity//|/\\|}" "${title//|/\\|}" "${advisory//|/\\|}"
                  annotation="$title CVE=$id; package=$package; installed=$installed; fixed=$fixed; target=$target; advisory=${advisory:-unavailable}."
                  if [[ "$fixed" == "No fix published" ]]; then
                    echo "::warning title=Trivy image WARN::$annotation Track vendor remediation; no safe upgrade is currently published." >&2
                  else
                    echo "::error title=Trivy image BLOCK::$annotation Upgrade the base image/package to the listed fixed version and rebuild." >&2
                  fi
                done
              echo
              echo "**Remediation:** update the affected base image or package to a version containing the listed fix. Findings without a fix remain visible as warnings and require tracking."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if (( blocking > 0 )); then
            echo "Security delta rejected: $blocking fixable finding(s) exist in HEAD but not in trusted base $BASELINE_COMMIT." >&2
            exit 10
          fi
      - name: Export exact scanned image for downstream publish verification
        id: export_candidate
        if: inputs.export-image-artifact && steps.classify_image.outcome == 'success'
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          SCANNED_IMAGE_ID: ${{ steps.classify_image.outputs.scanned_image_id }}
          SUBJECT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SCANNED_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error title=Image export SCANNER_ERROR::The classifier did not expose a valid immutable image ID."
            exit 30
          }

          candidate_tag="${IMAGE_NAME}:candidate-${SUBJECT_COMMIT}"
          artifact_name="trivy-image-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$SCANNED_IMAGE_ID" "$candidate_tag"
          docker save --output trivy-image-candidate.tar "$candidate_tag"
          archive_sha256="$(sha256sum trivy-image-candidate.tar | cut -d ' ' -f1)"

          jq -n \
            --arg image_name "$IMAGE_NAME" \
            --arg candidate_tag "$candidate_tag" \
            --arg image_id "$SCANNED_IMAGE_ID" \
            --arg subject_commit "$SUBJECT_COMMIT" \
            --arg archive_sha256 "$archive_sha256" \
            '{
              image_name: $image_name,
              candidate_tag: $candidate_tag,
              image_id: $image_id,
              subject_commit: $subject_commit,
              archive_sha256: $archive_sha256
            }' > trivy-image-subject.json

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "subject_commit=$SUBJECT_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Install keyless signing verifier
        if: inputs.export-image-artifact && steps.export_candidate.outcome == 'success'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign security approval for the exact scanned subject
        if: inputs.export-image-artifact && steps.export_candidate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --bundle trivy-image-subject.bundle \
            trivy-image-subject.json
      - name: Preserve exact scanned image candidate
        id: upload_candidate
        if: inputs.export-image-artifact && steps.export_candidate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.export_candidate.outputs.artifact_name }}
          path: |
            trivy-image-candidate.tar
            trivy-image-subject.json
            trivy-image-subject.bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
