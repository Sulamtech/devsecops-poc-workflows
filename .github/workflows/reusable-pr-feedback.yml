name: reusable-pr-feedback

on:
  workflow_call:
    inputs:
      integrity-result:
        required: true
        type: string
      tests-result:
        required: true
        type: string
      security-result:
        required: true
        type: string

permissions: {}

jobs:
  feedback:
    name: pr-feedback
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create or update the DevSecOps feedback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INTEGRITY_RESULT: ${{ inputs.integrity-result }}
          TESTS_RESULT: ${{ inputs.tests-result }}
          SECURITY_RESULT: ${{ inputs.security-result }}
        with:
          script: |
            const marker = '<!-- sulamtech-devsecops-poc-feedback -->';
            const allowed = new Set(['success', 'failure', 'cancelled', 'skipped']);
            const results = {
              Integrity: process.env.INTEGRITY_RESULT,
              Tests: process.env.TESTS_RESULT,
              Security: process.env.SECURITY_RESULT,
            };
            for (const [name, result] of Object.entries(results)) {
              if (!allowed.has(result)) throw new Error(`Unexpected ${name} result: ${result}`);
            }

            const pass = Object.values(results).every((result) => result === 'success');
            const decision = pass ? 'PASS' : 'BLOCK';
            const icon = pass ? '✅' : '⛔';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rows = Object.entries(results)
              .map(([name, result]) => `| ${name} | \`${result}\` |`)
              .join('\n');
            const prompt = pass ? '' : `\n\n### Prompt sugerido para tu agente\n\n> Revisa los checks fallidos de este PR y su evidencia exacta. Valida si la remediación sugerida es correcta para este repositorio; no la trates como fuente absoluta. Investiga versiones seguras vigentes, compatibilidad, advisories y tests afectados. Propón el cambio mínimo seguro, explica los trade-offs y ejecuta las pruebas antes de modificar código.`;
            const body = `${marker}\n## ${icon} DevSecOps — ${decision}\n\nCommit evaluado: \`${context.sha}\`\n\n| Control | Resultado |\n| --- | --- |\n${rows}\n\n[Evidencia completa del workflow](${runUrl})\n\nLa decisión la produce la policy determinista. La IA puede explicar o proponer, pero no aprueba, no hace merge y no despliega.${prompt}`;

            const issueNumber = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
