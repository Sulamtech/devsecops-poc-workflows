rules:
  - id: poc-java-command-injection
    message: Untrusted JAX-RS input reaches an operating-system command sink.
    languages: [java]
    severity: ERROR
    mode: taint
    metadata:
      category: security
      cwe: CWE-78
      source: JAX-RS @QueryParam
      sink: Runtime.exec or ProcessBuilder
      remediation: Map an allowlisted command identifier to fixed executable and argument values; never pass request input to the operating system.
    pattern-sources:
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., @QueryParam(...) $TYPE $SOURCE, ...) {
                ...
              }
          - focus-metavariable: $SOURCE
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($SINK)
              - pattern: getRuntime().exec($SINK)
              - pattern: new ProcessBuilder($SINK)
          - focus-metavariable: $SINK

  - id: poc-react-untrusted-html
    message: HTML reaches dangerouslySetInnerHTML without the approved escapeHtml sanitizer.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-79
      source: Component or request-controlled HTML
      sink: React dangerouslySetInnerHTML
      remediation: Prefer normal JSX interpolation; when raw HTML is unavoidable, pass it through the approved sanitizer before rendering.
    patterns:
      - pattern: '<$TAG ... dangerouslySetInnerHTML={{ __html: $HTML }} ... />'
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            const $HTML = escapeHtml(...);
            ...
          }

  - id: poc-browser-innerhtml-assignment
    message: Function input is assigned directly to element.innerHTML.
    languages: [typescript]
    severity: ERROR
    metadata:
      category: security
      cwe: CWE-79
      source: Function parameter containing untrusted HTML
      sink: Browser element.innerHTML
      remediation: Use textContent for text or pass HTML through the approved sanitizer before assigning it.
    patterns:
      - pattern-inside: |
          function $FUNC(..., $SOURCE, ...) {
            ...
          }
      - pattern: $ELEMENT.innerHTML = $SOURCE
