name: Bug report
about: Report a reproducible defect in the public laboratory
labels: ["bug", "status:needs-review"]
body:
  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I understand implementation starts only after status:approved.
          required: true
  - type: textarea
    attributes:
      label: Bug description
      description: Describe the defect without secrets or SaleADS data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
    validations:
      required: true
