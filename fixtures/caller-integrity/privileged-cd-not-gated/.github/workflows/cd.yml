name: privileged cd without integrity ordering
on:
  push:
    branches: [poc-cd]
permissions: {}
jobs:
  integrity:
    permissions:
      contents: read
    uses: Sul4m/devsecops-poc-workflows/.github/workflows/reusable-caller-integrity.yml@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  security:
    permissions:
      contents: read
      id-token: write
    uses: Sul4m/devsecops-poc-workflows/.github/workflows/reusable-security.yml@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  publish:
    needs: security
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: Sul4m/devsecops-poc-workflows/.github/workflows/reusable-gcp-publish.yml@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
